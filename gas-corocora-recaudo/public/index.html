<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recaudo · Gas Corocora</title>
<style>
  :root { --verde:#1f6f43; --gris:#5b6670; --borde:#dde3e8; --fondo:#f5f7f8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background:var(--fondo); color:#1d2730; }
  header { background:var(--verde); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:1.15rem; }
  header small { opacity:.85; }
  main { padding:20px 24px; max-width:1200px; margin:auto; }
  section { background:#fff; border:1px solid var(--borde); border-radius:8px; margin-bottom:18px; overflow:auto; }
  h2 { font-size:1rem; margin:0; padding:12px 16px; border-bottom:1px solid var(--borde); }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--borde); white-space:nowrap; }
  th { color:var(--gris); font-weight:600; background:#fafbfc; }
  .num { text-align:right; font-variant-numeric: tabular-nums; }
  .chip { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.78rem; font-weight:600; }
  .PENDIENTE { background:#fff4d6; color:#8a6100; } .PAGO_PARCIAL { background:#e6efff; color:#1d4ed8; }
  .PAGADA { background:#dcf5e6; color:#166534; } .AJUSTADA { background:#ede9fe; color:#5b21b6; }
  .si { color:#166534; font-weight:600; } .no { color:#b42318; font-weight:600; }
  .vacio { padding:14px 16px; color:var(--gris); }
  button { background:var(--verde); color:#fff; border:0; border-radius:6px; padding:7px 12px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div><h1>Recaudo y Tesorería · Gas Corocora S.A. E.S.P.</h1><small>Servicio externo integrado con el proceso de Medición y Facturación</small></div>
  <button onclick="cargar()">Actualizar</button>
</header>
<main>
  <section><h2>Obligaciones de pago</h2><div id="obligaciones"></div></section>
  <section><h2>Pagos recibidos y notificación al motor</h2><div id="pagos"></div></section>
  <section><h2>Notas crédito (ajustes de PQRS)</h2><div id="notas"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const cop = (v) => v == null ? "—" : "$" + Number(v).toLocaleString("es-CO");
const esc = (t) => String(t ?? "—").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function tabla(filas, columnas) {
  if (!filas.length) return '<div class="vacio">Sin registros todavía.</div>';
  return "<table><tr>" + columnas.map(c => `<th class="${c[2]||""}">${c[0]}</th>`).join("") + "</tr>" +
    filas.map(f => "<tr>" + columnas.map(c => `<td class="${c[2]||""}">${c[1](f)}</td>`).join("") + "</tr>").join("") + "</table>";
}
async function cargar() {
  const r = await fetch("/api/resumen").then(x => x.json());
  $("obligaciones").innerHTML = tabla(r.obligaciones, [
    ["Referencia", f => esc(f.referenciaPago)], ["Factura", f => esc(f.numeroFactura)], ["Cuenta", f => esc(f.numeroCuenta)],
    ["Valor", f => cop(f.valor), "num"], ["Saldo", f => cop(f.saldo), "num"], ["Vence", f => esc(f.fechaLimite)],
    ["Estado", f => `<span class="chip ${f.estado}">${f.estado}</span>`], ["Creada", f => esc(f.creadaEn)]]);
  $("pagos").innerHTML = tabla(r.pagos, [
    ["Comprobante", f => esc(f.numeroComprobante)], ["Referencia", f => esc(f.referenciaPago)], ["Valor", f => cop(f.valor), "num"],
    ["Medio", f => esc(f.medioPago)], ["¿Motor notificado?", f => f.notificadoMotor ? '<span class="si">Sí</span>' : '<span class="no">No</span>'],
    ["Respuesta del motor", f => { try { return esc(JSON.parse(f.respuestaMotor).detalle); } catch { return "—"; } }],
    ["Fecha", f => esc(f.registradoEn)]]);
  $("notas").innerHTML = tabla(r.notasCredito, [
    ["Nota crédito", f => esc(f.numeroNotaCredito)], ["Cuenta", f => esc(f.numeroCuenta)], ["Radicado PQRS", f => esc(f.numeroRadicado)],
    ["Referencia", f => esc(f.referenciaPago)], ["Valor", f => cop(f.valor), "num"], ["Aplicado", f => cop(f.valorAplicado), "num"],
    ["Saldo anterior", f => cop(f.saldoAnterior), "num"], ["Nuevo saldo", f => cop(f.nuevoSaldo), "num"], ["Fecha", f => esc(f.registradaEn)]]);
}
cargar(); setInterval(cargar, 5000);
</script>
</body>
</html>
