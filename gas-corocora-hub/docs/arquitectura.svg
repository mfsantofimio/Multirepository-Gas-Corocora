<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44505c"/>
    </marker>
    <style>
      .caja{stroke-width:1.5;rx:10}
      .t{font-weight:700;font-size:15px;fill:#1d2730}
      .s{fill:#4b5560;font-size:12px}
      .p{fill:#1d2730;font-size:12px;font-weight:600}
      .l{stroke:#44505c;stroke-width:1.6;fill:none;marker-end:url(#f)}
      .ld{stroke:#44505c;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#f)}
      .e{font-size:11.5px;fill:#24303b}
      .eb{font-size:11.5px;fill:#24303b;font-weight:700}
      .fondo{fill:#fff;opacity:.92}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#f7f9fa"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2730">Gas Corocora — Arquitectura del sistema (3.ª entrega)</text>
  <text x="600" y="56" text-anchor="middle" class="s">Un repositorio por componente · gas-corocora-hub integra la documentación, la configuración de ejemplo y los scripts</text>

  <!-- Actores -->
  <g>
    <circle cx="120" cy="120" r="14" fill="#2f7d4f"/><rect x="104" y="136" width="32" height="30" rx="8" fill="#2f7d4f"/>
    <text x="120" y="186" text-anchor="middle" class="p">Usuario externo</text>
    <text x="120" y="201" text-anchor="middle" class="s">suscriptor / solicitante</text>
    <circle cx="1080" cy="120" r="14" fill="#1e4e79"/><rect x="1064" y="136" width="32" height="30" rx="8" fill="#1e4e79"/>
    <text x="1080" y="186" text-anchor="middle" class="p">Funcionario por rol</text>
    <text x="1080" y="201" text-anchor="middle" class="s">10 grupos (candidateGroups)</text>
    <circle cx="600" cy="100" r="12" fill="#6b4fa1"/><rect x="586" y="114" width="28" height="24" rx="7" fill="#6b4fa1"/>
    <text x="600" y="156" text-anchor="middle" class="p">Administrador</text>
  </g>

  <!-- Portales -->
  <rect x="40" y="240" width="270" height="150" class="caja" fill="#e3f4ea" stroke="#2f7d4f"/>
  <text x="56" y="266" class="t">Portal de usuarios externos</text>
  <text x="56" y="285" class="s">gas-corocora-portal-usuarios · :8081</text>
  <text x="56" y="305" class="e">Spring Boot 3.2 + Thymeleaf</text>
  <text x="56" y="323" class="e">• Registro e ingreso del suscriptor</text>
  <text x="56" y="340" class="e">• Solicitar conexión (P3) · Radicar PQRS (P2)</text>
  <text x="56" y="357" class="e">• Firmar contrato · Interponer recurso · Pagar</text>
  <text x="56" y="374" class="e">• Validación de entradas (Bean Validation)</text>

  <rect x="890" y="240" width="270" height="150" class="caja" fill="#e3edf7" stroke="#1e4e79"/>
  <text x="906" y="266" class="t">Portal interno</text>
  <text x="906" y="285" class="s">gas-corocora-portal-interno · :8082</text>
  <text x="906" y="305" class="e">Spring Boot 3.2 + Thymeleaf</text>
  <text x="906" y="323" class="e">• Bandeja de tareas por rol</text>
  <text x="906" y="340" class="e">• Camunda Forms dibujados y validados</text>
  <text x="906" y="357" class="e">• Información del caso, decisiones, variables</text>
  <text x="906" y="374" class="e">• Iniciar procesos por ventanilla · Casos</text>

  <!-- Motor -->
  <rect x="370" y="210" width="460" height="300" class="caja" fill="#fff" stroke="#6b4fa1"/>
  <text x="386" y="236" class="t">Motor de procesos</text>
  <text x="386" y="255" class="s">gas-corocora-motor · :8080 · Spring Boot 3.2 + Camunda 7.21 embebido</text>
  <rect x="386" y="268" width="210" height="104" rx="8" fill="#f1ecfa" stroke="#b9a6dd"/>
  <text x="396" y="288" class="p">Camunda Engine</text>
  <text x="396" y="305" class="e">6 BPMN · 3 DMN · 17 Forms</text>
  <text x="396" y="321" class="e">Timers, mensajes, call activities</text>
  <text x="396" y="337" class="e">JavaDelegates (Java Class / Delegate</text>
  <text x="396" y="352" class="e">Expression) · External Tasks</text>
  <rect x="606" y="268" width="210" height="104" rx="8" fill="#f1ecfa" stroke="#b9a6dd"/>
  <text x="616" y="288" class="p">APIs REST</text>
  <text x="616" y="305" class="e">/api/suscriptores · /api/casos</text>
  <text x="616" y="321" class="e">/api/conexiones · /api/pqrs</text>
  <text x="616" y="337" class="e">/api/facturacion (mensajes)</text>
  <text x="616" y="353" class="e">/engine-rest (Camunda estándar)</text>
  <rect x="386" y="382" width="210" height="112" rx="8" fill="#f1ecfa" stroke="#b9a6dd"/>
  <text x="396" y="402" class="p">Persistencia de negocio</text>
  <text x="396" y="419" class="e">SincronizacionNegocioListener</text>
  <text x="396" y="435" class="e">(Spring Eventing Bridge) proyecta</text>
  <text x="396" y="451" class="e">variables → tablas GC_* y bitácora</text>
  <text x="396" y="467" class="e">NegocioRepository (JdbcTemplate)</text>
  <text x="396" y="483" class="e">IdentidadInicializador (roles)</text>
  <rect x="606" y="382" width="210" height="112" rx="8" fill="#f1ecfa" stroke="#b9a6dd"/>
  <text x="616" y="402" class="p">Webapps Camunda</text>
  <text x="616" y="419" class="e">Cockpit: instancias, incidentes,</text>
  <text x="616" y="435" class="e">variables, caminos recorridos</text>
  <text x="616" y="451" class="e">Tasklist / Admin (demo / demo)</text>
  <text x="616" y="467" class="e">Consola H2: /h2-console</text>

  <!-- BD motor -->
  <path d="M430,600 a170,16 0 0,0 340,0 v76 a170,16 0 0,1 -340,0 z" fill="#fdf6e3" stroke="#b08a2e" stroke-width="1.5"/>
  <ellipse cx="600" cy="600" rx="170" ry="16" fill="#fbefcf" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="600" y="636" text-anchor="middle" class="p">H2 en archivo ./h2/camunda-db</text>
  <text x="600" y="653" text-anchor="middle" class="e">ACT_* (Camunda: runtime, historia, identidad)</text>
  <text x="600" y="669" text-anchor="middle" class="e">GC_* (suscriptor, cuenta, solicitud, factura, pqrs, evento_caso)</text>

  <!-- Workers -->
  <rect x="890" y="470" width="270" height="110" class="caja" fill="#fff4e0" stroke="#c07a12"/>
  <text x="906" y="496" class="t">Workers JavaScript</text>
  <text x="906" y="515" class="s">gas-corocora-workers · Node 18+</text>
  <text x="906" y="535" class="e">EnviarFactura · NotificarRespuestaPqrs</text>
  <text x="906" y="551" class="e">EnviarContratoConexion</text>
  <text x="906" y="567" class="e">fetchAndLock / complete / handleFailure</text>

  <!-- Recaudo -->
  <rect x="40" y="470" width="270" height="130" class="caja" fill="#fde9e7" stroke="#b42318"/>
  <text x="56" y="496" class="t">Servicio de Recaudo / Tesorería</text>
  <text x="56" y="515" class="s">gas-corocora-recaudo · :8083 · Node 22.13+</text>
  <text x="56" y="535" class="e">• Obligaciones de pago por factura</text>
  <text x="56" y="551" class="e">• Pagos (PSE/tarjeta) → avisa al motor</text>
  <text x="56" y="567" class="e">• Notas crédito y saldo a favor</text>
  <text x="56" y="583" class="e">• Consola de tesorería</text>
  <path d="M90,660 a70,12 0 0,0 140,0 v50 a70,12 0 0,1 -140,0 z" fill="#fde9e7" stroke="#b42318" stroke-width="1.5"/>
  <ellipse cx="160" cy="660" rx="70" ry="12" fill="#fbd5d1" stroke="#b42318" stroke-width="1.5"/>
  <text x="160" y="692" text-anchor="middle" class="p">SQLite recaudo.db</text>
  <text x="160" y="707" text-anchor="middle" class="e">node:sqlite</text>

  <!-- Flechas -->
  <path class="l" d="M120,210 V236"/>
  <path class="l" d="M1080,210 V236"/>
  <path class="l" d="M600,162 V206"/>
  <text x="608" y="190" class="e">Cockpit / Tasklist</text>

  <!-- portal usuarios -> motor -->
  <path class="l" d="M310,290 H366"/>
  <rect x="314" y="262" width="50" height="22" class="fondo"/><text x="316" y="276" class="eb">①</text>
  <!-- portal usuarios -> recaudo -->
  <path class="l" d="M175,390 V466"/>
  <text x="183" y="433" class="eb">② pagar</text>
  <!-- recaudo -> motor -->
  <path class="l" d="M310,520 C350,520 350,470 382,470"/>
  <text x="326" y="498" class="eb">③</text>
  <!-- motor -> recaudo (nota credito) -->
  <path class="ld" d="M382,500 C345,500 345,575 314,575"/>
  <text x="352" y="566" class="eb">④</text>
  <!-- portal interno -> motor -->
  <path class="l" d="M890,300 H834"/>
  <text x="846" y="290" class="eb">⑤</text>
  <!-- workers <-> motor -->
  <path class="l" d="M890,500 H834"/>
  <path class="l" d="M834,520 H890"/>
  <text x="846" y="492" class="eb">⑥</text>
  <!-- workers -> recaudo -->
  <path class="ld" d="M1025,580 V735 H280 V604"/>
  <text x="600" y="752" text-anchor="middle" class="eb">⑦ EnviarFactura → POST /api/obligaciones (referencia y enlace de pago)</text>
  <!-- recaudo <-> sqlite -->
  <path class="l" d="M160,600 V644"/>
  <!-- motor <-> H2 -->
  <path class="l" d="M600,510 V580"/>
  <text x="608" y="550" class="eb">⑧ JDBC</text>
</svg>
