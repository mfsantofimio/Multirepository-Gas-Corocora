<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Error')}"></head>
<body>
<div th:replace="~{fragmentos :: barra('')}"></div>
<main>
  <div class="tarjeta estrecha">
    <div class="cab"><h2>Algo salió mal</h2><span class="chip error" th:text="${status}">500</span></div>
    <div class="cuerpo">
      <p th:text="${error}">Error</p>
      <p class="pendiente" th:text="${message}"></p>
      <a class="btn" th:href="@{/}">Volver al inicio</a>
    </div>
  </div>
</main>
</body>
</html>
