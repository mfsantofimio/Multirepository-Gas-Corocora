<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Detalle del trámite')}"></head>
<body>
<div th:replace="~{fragmentos :: barra('panel')}"></div>
<main>
  <h1><span th:text="${caso.tipo}">TIPO</span> · <span th:text="${caso.referencia}">REF</span></h1>
  <p class="sub">Estado del proceso: <span th:class="${fmt.claseEstado(caso.registro.estadoProceso)}" th:text="${fmt.estado(caso.registro.estadoProceso)}">En curso</span>
    · Estado del trámite: <span th:class="${fmt.claseEstado(caso.registro.estado)}" th:text="${fmt.estado(caso.registro.estado)}">Radicada</span></p>
  <div class="rejilla" style="align-items:start">
    <div class="tarjeta">
      <div class="cab"><h2>Información registrada</h2></div>
      <div class="cuerpo tabla">
        <table>
          <tr th:each="e : ${caso.registro}"
              th:unless="${e.key == 'processInstanceId' or e.key == 'tareasPendientes' or e.key == 'mensajesEsperados' or e.key == 'accionesUsuario' or e.key == 'estadoProceso'}">
            <th th:text="${fmt.etiqueta(e.key)}">campo</th>
            <td th:text="${fmt.texto(e.value)}">valor</td>
          </tr>
        </table>
      </div>
    </div>
    <div>
      <div class="tarjeta">
        <div class="cab"><h2>Pendiente en este momento</h2></div>
        <div class="cuerpo">
          <p class="vacio" th:if="${#lists.isEmpty(caso.registro.tareasPendientes) and #lists.isEmpty(caso.registro.mensajesEsperados)}">Nada pendiente.</p>
          <div th:each="t : ${caso.registro.tareasPendientes}" class="dato" style="margin-bottom:8px">Tarea de la empresa<b th:text="${t.nombre}">Tarea</b></div>
          <div th:each="m : ${caso.registro.mensajesEsperados}" class="dato" style="margin-bottom:8px">Esperando<b th:text="${m}">Mensaje</b></div>
        </div>
      </div>
      <div class="tarjeta">
        <div class="cab"><h2>Historial</h2></div>
        <div class="cuerpo">
          <ul class="linea-tiempo">
            <li th:each="ev : ${caso.eventos}">
              <b th:text="${ev.actividad}">Actividad</b>
              <span class="chip" th:text="${ev.evento}">EVENTO</span>
              <div class="cuando"><span th:text="${ev.fecha}">fecha</span><span th:if="${ev.usuario != null}" th:text="' · ' + ${ev.usuario}"></span></div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <a class="btn sec" th:href="@{/panel}">Volver</a>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
