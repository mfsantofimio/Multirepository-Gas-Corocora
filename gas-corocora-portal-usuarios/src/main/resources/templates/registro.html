<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Registro')}"></head>
<body>
<div th:replace="~{fragmentos :: barra('')}"></div>
<main>
  <div class="tarjeta media" style="margin:auto">
    <div class="cab"><h2>Registro de usuario</h2></div>
    <div class="cuerpo">
      <p class="sub">Con su registro podrá solicitar la conexión al gas natural, radicar PQRS, pagar facturas y consultar sus trámites.</p>
      <div th:replace="~{fragmentos :: avisos}"></div>
      <form class="campos" th:action="@{/registro}" th:object="${form}" method="post">
        <div class="dos">
          <div class="campo" th:classappend="${#fields.hasErrors('documento')} ? 'invalido'">
            <label for="documento">Número de documento</label>
            <input type="text" id="documento" th:field="*{documento}" inputmode="numeric" pattern="[0-9]{6,12}" required>
            <div class="ayuda">Solo números, 6 a 12 dígitos.</div>
            <div class="err" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></div>
          </div>
          <div class="campo" th:classappend="${#fields.hasErrors('nombre')} ? 'invalido'">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" th:field="*{nombre}" minlength="3" maxlength="120" required>
            <div class="err" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
          </div>
        </div>
        <div class="dos">
          <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'invalido'">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" th:field="*{email}" required>
            <div class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>
          <div class="campo" th:classappend="${#fields.hasErrors('telefono')} ? 'invalido'">
            <label for="telefono">Celular</label>
            <input type="tel" id="telefono" th:field="*{telefono}" pattern="3[0-9]{9}" required>
            <div class="ayuda">10 dígitos, empieza por 3.</div>
            <div class="err" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
          </div>
        </div>
        <div class="dos">
          <div class="campo" th:classappend="${#fields.hasErrors('direccion')} ? 'invalido'">
            <label for="direccion">Dirección de residencia</label>
            <input type="text" id="direccion" th:field="*{direccion}" maxlength="200" required>
            <div class="err" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
          </div>
          <div class="campo" th:classappend="${#fields.hasErrors('municipio')} ? 'invalido'">
            <label for="municipio">Municipio</label>
            <select id="municipio" th:field="*{municipio}" required>
              <option th:each="m : ${catalogos.municipios}" th:value="${m.key}" th:text="${m.value}">Villavicencio</option>
            </select>
            <div class="err" th:if="${#fields.hasErrors('municipio')}" th:errors="*{municipio}"></div>
          </div>
        </div>
        <div class="dos">
          <div class="campo" th:classappend="${#fields.hasErrors('clave')} ? 'invalido'">
            <label for="clave">Clave</label>
            <input type="password" id="clave" th:field="*{clave}" minlength="6" maxlength="40" required>
            <div class="err" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></div>
          </div>
          <div class="campo" th:classappend="${#fields.hasErrors('confirmacion')} ? 'invalido'">
            <label for="confirmacion">Confirmar clave</label>
            <input type="password" id="confirmacion" th:field="*{confirmacion}" required>
            <div class="err" th:if="${#fields.hasErrors('confirmacion')}" th:errors="*{confirmacion}"></div>
          </div>
        </div>
        <div class="acciones">
          <button class="btn" type="submit">Registrarme</button>
          <a class="btn sec" th:href="@{/ingresar}">Ya tengo cuenta</a>
        </div>
      </form>
    </div>
  </div>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
